[package]
name = "dict"
version = "0.1.0"
description = "AI Dictionary App"
authors = ["you"]
edition = "2021"

[lib]
name = "dict_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools", "image-png"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-notification = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-http = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "time", "rt", "macros"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# 只在桌面平台编：tray-icon（连带 muda）/ 单实例 / 自启 / 全局快捷键在 Android 上
# 要么编不过（muda 没有 android 的 platform_impl），要么没有对应能力。
# 对应代码在 lib.rs 里已经是 #[cfg(desktop)]。
[target.'cfg(any(target_os = "windows", target_os = "macos", target_os = "linux"))'.dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tray-icon = "0.23"
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
tauri-plugin-global-shortcut = "2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = ["Win32_UI_Input_KeyboardAndMouse"] }

[profile.dev]
strip = "debuginfo"
