[package]
name = "dict"
version = "0.1.0"
description = "AI Dictionary App"
authors = ["you"]
edition = "2021"

[lib]
name = "dict_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# 只需要 http 插件：Tauri 客户端发请求走 Rust 侧，不受 CORS 与 Android cleartext 限制。
tauri = { version = "2", features = ["devtools", "image-png"] }
tauri-plugin-http = "2"

[profile.dev]
strip = "debuginfo"
